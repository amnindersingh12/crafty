{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{% block title %}Getting Crafty{% endblock %}</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Satisfy&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body class="wf-loading">
    <!-- Header -->
    <header id="header" class="header" data-transparent="true">
        <div class="header-inner">
            <!-- Logo -->
            <div class="header-logo">
                <a href="{% url 'core:home' %}">
                    <span class="logo-text">Getting Crafty</span>
                </a>
            </div>

            <!-- Navigation -->
            <nav class="header-nav">
                <div class="nav-item nav-dropdown">
                    <button class="nav-dropdown-trigger" aria-expanded="false">
                        diy projects
                        <svg class="dropdown-arrow" width="12" height="12" viewBox="0 0 12 12">
                            <path d="M2 4L6 8L10 4" fill="none" stroke="currentColor" stroke-width="1.5" />
                        </svg>
                    </button>
                    <div class="nav-dropdown-content">
                        <a href="{% url 'core:shop' %}">all projects</a>
                        {% for cat in all_categories %}
                        <a href="{% url 'core:shop' %}?category={{ cat.slug }}">{{ cat.name|lower }}</a>
                        {% endfor %}
                    </div>
                </div>
                <a href="{% url 'core:shop' %}" class="nav-item">shop</a>
            </nav>

            <!-- Cart -->
            <div class="header-actions">
                <a href="{% url 'core:cart' %}" class="cart-icon">
                    <svg class="icon--cart" width="24" height="20" viewBox="0 0 61 49">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M0.5 2C0.5 1.17157 1.17157 0.5 2 0.5H13.6362C14.3878 0.5 15.0234 1.05632 15.123 1.80135L16.431 11.5916H59C59.5122 11.5916 59.989 11.8529 60.2645 12.2847C60.54 12.7165 60.5762 13.2591 60.3604 13.7236L50.182 35.632C49.9361 36.1614 49.4054 36.5 48.8217 36.5H18.0453C17.2937 36.5 16.6581 35.9437 16.5585 35.1987L12.3233 3.5H2C1.17157 3.5 0.5 2.82843 0.5 2ZM16.8319 14.5916L19.3582 33.5H47.8646L56.6491 14.5916H16.8319Z"
                            fill="currentColor" />
                        <path
                            d="M21 49C23.2091 49 25 47.2091 25 45C25 42.7909 23.2091 41 21 41C18.7909 41 17 42.7909 17 45C17 47.2091 18.7909 49 21 49Z"
                            fill="currentColor" />
                        <path
                            d="M45 49C47.2091 49 49 47.2091 49 45C49 42.7909 47.2091 41 45 41C42.7909 41 41 42.7909 41 45C41 47.2091 42.7909 49 45 49Z"
                            fill="currentColor" />
                    </svg>
                    <span class="cart-count" id="cart-count">0</span>
                </a>

                <!-- Mobile Menu Toggle -->
                <button class="mobile-menu-toggle" aria-label="Open menu">
                    <span class="hamburger-line"></span>
                    <span class="hamburger-line"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Mobile Menu Overlay -->
    <div class="mobile-menu" id="mobile-menu">
        <nav class="mobile-nav">
            <a href="{% url 'core:home' %}">Home</a>
            <a href="#">DIY Projects</a>
            <a href="{% url 'core:shop' %}">Shop</a>
            <a href="{% url 'core:cart' %}">Cart</a>
        </nav>
    </div>

    <!-- Main Content -->
    <main id="main">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="social-icons">
                <a href="https://www.tiktok.com/#" target="_blank" aria-label="TikTok">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path fill="currentColor"
                            d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-5.2 1.74 2.89 2.89 0 012.31-4.64 2.93 2.93 0 01.88.13V9.4a6.84 6.84 0 00-1-.05A6.33 6.33 0 005 20.1a6.34 6.34 0 0010.86-4.43v-7a8.16 8.16 0 004.77 1.52v-3.4a4.85 4.85 0 01-1-.1z" />
                    </svg>
                </a>
                <a href="https://www.instagram.com/#" target="_blank" aria-label="Instagram">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path fill="currentColor"
                            d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z" />
                    </svg>
                </a>
                <a href="https://www.youtube.com/#" target="_blank" aria-label="YouTube">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path fill="currentColor"
                            d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
                    </svg>
                </a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}

    <script>
        // Remove font loading class
        document.fonts.ready.then(() => {
            document.body.classList.remove('wf-loading');
        });

        // Update cart count on load
        fetch('{% url "core:cart_count" %}')
            .then(res => res.json())
            .then(data => {
                document.getElementById('cart-count').textContent = data.count;
            });
    </script>
</body>

</html>
